# Testes das `firestore.rules` no emulador (issue #39).
#
# `emulators:exec` sobe o firestore e o auth, roda o comando e derruba tudo: se
# o emulador nao subir, o job falha (a suite nao passa "por falta de emulador").
# O CI de `flutter analyze`/`flutter test`/pipeline e a issue #40, em workflow
# separado — este aqui precisa de java e node por causa do emulador.
name: regras do firestore

on:
  pull_request:
  push:
    branches: [main]

jobs:
  emulador:
    name: firestore.rules no emulador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # firebase-tools 15 pede node >= 20, e o emulador do firestore roda em
      # java 21+ (o runner ja tem, mas a versao fica explicita).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # pinada por commit: o SonarCloud (githubactions:S7637) exige o SHA cheio
      # das actions de terceiros; a tag fica no comentario.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # `--enforce-lockfile`: usa o `pubspec.lock` versionado e falha se ele
      # precisaria mudar (mesma versao da SDK do docker/flutter/Dockerfile).
      - run: flutter pub get --enforce-lockfile
      # versao exata + `--ignore-scripts` (os scripts de ciclo de vida do npm
      # sao o que o SonarCloud pede para nao rodar: s6505/s8543/s8550)
      - run: npm install -g firebase-tools@15.32.0 --ignore-scripts

      # mesmo comando do README; `demo-achar-vagas` e o projeto do `.firebaserc`
      # (prefixo `demo-`: nada aqui toca o firebase real)
      - name: roda a suite das regras
        run: firebase emulators:exec --only firestore,auth --project demo-achar-vagas "flutter test test_emulador"
